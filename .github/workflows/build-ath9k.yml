# Save in your repo as:  .github/workflows/build-ath9k.yml
# Repo files needed in the root: config.txt  ksyms.txt  known_crcs.txt  check_ath9k.py
# Repo must be PUBLIC (free private runners only have 7 GB RAM, too little).
# UNTESTED: written without network access. First run may need small fixes.
name: Build ath9k_htc modules

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel manifest branch"
        default: "common-android12-5.10-2025-02"
      common_tag:
        description: "Kernel source tag (r2 = your tablet's exact build, 49c66df526b8)"
        default: "android12-5.10-2025-02_r2"
      lto:
        description: "LTO mode (thin uses less RAM; try full if thin fails the check)"
        type: choice
        default: thin
        options: [thin, full]
      extra_config:
        description: "Extra scripts/config args, e.g. -e MAC80211_DEBUGFS -d CFG80211_WEXT"
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 345
    env:
      BRANCH: ${{ inputs.branch }}
      COMMON_TAG: ${{ inputs.common_tag }}
      LTO: ${{ inputs.lto }}
      EXTRA: ${{ inputs.extra_config }}
      MKARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h / | tail -1
          free -g | head -2

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio rsync zip unzip git curl xz-utils binutils

      - name: Download Android kernel source
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global color.ui false
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          mkdir ack && cd ack
          ~/bin/repo init --depth=1 --no-clone-bundle -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" </dev/null
          # The manifest points kernel/common at a branch that no longer exists,
          # so pin it to the release tag instead.
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/common.xml <<EOF
          <manifest>
          <remove-project name="kernel/common" />
          <project path="common" name="kernel/common" remote="aosp" revision="refs/tags/$COMMON_TAG" clone-depth="1" />
          </manifest>
          EOF
          cat .repo/local_manifests/common.xml
          ~/bin/repo sync -c -j8 --no-tags --no-clone-bundle --force-sync </dev/null
          CLANG=$(ls -d "$PWD"/prebuilts*/clang/host/linux-x86/clang-r416183b | head -1)
          if [ ! -x "$CLANG/bin/clang" ]; then
            echo "clang-r416183b not found. Available:"
            ls prebuilts*/clang/host/linux-x86
            exit 1
          fi
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          "$CLANG/bin/clang" --version | head -1
          git -C common log -1 --format='kernel commit %h  %s'
          df -h / | tail -1

      - name: Configure (start from the tablet's own config)
        run: |
          set -ex
          echo "EXTRA=[$EXTRA] LTO=[$LTO]"
          export PATH="$CLANG/bin:$PATH"
          mkdir -p out
          cp config.txt out/.config
          S="ack/common/scripts/config --file out/.config"
          if [ "$LTO" = thin ]; then $S -d LTO_CLANG_FULL -e LTO_CLANG_THIN; fi
          $S -d TRIM_UNUSED_KSYMS --set-str UNUSED_KSYMS_WHITELIST "" -d COMPAT_VDSO
          $S -e WLAN -e WLAN_VENDOR_ATH -m CFG80211 -m MAC80211 -m ATH_COMMON -m ATH_CARDS -m ATH9K_HTC
          # The tablet's cfg80211/mac80211 have no wext, testmode, LED, mesh or debugfs code.
          # ath9k normally force-enables MAC80211_LEDS, so remove that select first.
          sed -i '/select MAC80211_LEDS/d' ack/common/drivers/net/wireless/ath/ath9k/Kconfig
          $S -d NL80211_TESTMODE -d CFG80211_WEXT -d CFG80211_DEBUGFS -d MAC80211_LEDS -d MAC80211_MESH -d MAC80211_DEBUGFS
          if [ -n "${EXTRA// /}" ]; then $S $EXTRA; fi
          cd ack/common
          make O="$GITHUB_WORKSPACE/out" $MKARGS olddefconfig
          grep -E '^CONFIG_(ATH9K_HTC|ATH_COMMON|CFG80211|MAC80211|CFI_CLANG|LTO_CLANG_(FULL|THIN)|MODVERSIONS|SHADOW_CALL_STACK)=' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_ATH9K_HTC=m' "$GITHUB_WORKSPACE/out/.config" || { echo "ATH9K_HTC was not enabled"; exit 1; }
          for o in NL80211_TESTMODE CFG80211_WEXT CFG80211_DEBUGFS MAC80211_LEDS MAC80211_MESH MAC80211_DEBUGFS; do
            if grep -q "^CONFIG_$o=" "$GITHUB_WORKSPACE/out/.config"; then echo "$o is still enabled (something selects it)"; exit 1; fi
          done

      - name: Build kernel and modules (1-2 hours)
        run: |
          export PATH="$CLANG/bin:$PATH"
          cd ack/common
          make -j"$(nproc)" O="$GITHUB_WORKSPACE/out" $MKARGS modules

      - name: Collect modules and firmware
        run: |
          set -e
          mkdir -p dist/ath9k_htc
          for m in ath ath9k_hw ath9k_common ath9k_htc; do
            f=$(find out -name "$m.ko" | head -1)
            test -n "$f" || { echo "$m.ko was not built"; exit 1; }
            cp "$f" dist/
          done
          mkdir -p dist/compare_only
          for m in cfg80211 mac80211; do
            f=$(find out -name "$m.ko" | head -1)
            test -n "$f" && cp "$f" dist/compare_only/
          done
          "$CLANG/bin/llvm-strip" --strip-debug dist/*.ko dist/compare_only/*.ko
          cp out/.config dist/kernel.config
          strings -a dist/ath9k_htc.ko | grep -E 'htc_(9271|7010)' | sort -u | tee dist/firmware_names.txt || true
          curl -fsSL -o dist/ath9k_htc/htc_9271-1.4.0.fw "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw" || echo "firmware download failed, fetch it manually"
          ls -l dist dist/ath9k_htc

      - name: Check against the tablet
        run: |
          set +e
          python3 check_ath9k.py ksyms.txt known_crcs.txt dist/ath.ko dist/ath9k_hw.ko dist/ath9k_common.ko dist/ath9k_htc.ko > dist/check_result.txt 2>&1
          rc=$?
          python3 - >> dist/check_result.txt 2>&1 <<'PY'
          import struct
          def exports(path):
              d = open(path, 'rb').read()
              shoff = struct.unpack('<Q', d[0x28:0x30])[0]
              ent, num, _ = struct.unpack('<HHH', d[0x3A:0x40])
              secs = [struct.unpack('<IIQQQQIIQQ', d[shoff+i*ent:shoff+i*ent+64]) for i in range(num)]
              out = {}
              for n, t, f, a, off, size, link, info, al, es in secs:
                  if t == 2:
                      so = secs[link][4]
                      for k in range(1, size // 24):
                          nm, inf, oth, sh, val, sz = struct.unpack('<IBBHQQ', d[off+k*24:off+k*24+24])
                          s = d[so+nm:d.index(b'\0', so+nm)].decode()
                          if s.startswith('__crc_'):
                              out[s[6:]] = val & 0xffffffff
              return out
          known = {}
          for l in open('known_crcs.txt'):
              p = l.split()
              if len(p) == 2:
                  known[p[0]] = int(p[1], 16)
          print()
          print('Our cfg80211/mac80211 exports vs the tablet (diagnostic only):')
          for m in ('cfg80211', 'mac80211'):
              e = exports('dist/compare_only/%s.ko' % m)
              bad = sorted(s for s, c in e.items() if s in known and known[s] != c)
              print('%s: %d exports, %d differ from the tablet' % (m, len(e), len(bad)))
              for s in bad[:40]:
                  print('   EXPORT DIFFERS:', s)
          PY
          cat dist/check_result.txt
          {
            echo "### Check result (LTO=$LTO)"
            echo '```'
            cat dist/check_result.txt
            echo '```'
            git -C ack/common log -1 --format='kernel commit %h'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-modules
          path: dist/
          if-no-files-found: warn
